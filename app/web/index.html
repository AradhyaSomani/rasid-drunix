<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RASID Console</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --faint: #a3a3a8;
    --accent: #1F4E9A; --accent-2: #6d8fc7; --accent-3: #adc2e6; --accent-ink: #ffffff; --accent-soft: #e8eef8;
    --bad: #b5523b; --ok: #2f6b3f; --band: #f3f3ef; --track: #e6e6e0; --hold: #cfcfc8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131315; --panel: #1b1b1e; --ink: #ececee; --muted: #9a9aa2; --faint: #66666e;
            --accent: #7fa6e8; --accent-2: #5576ad; --accent-3: #34496e; --accent-ink: #0f1a2d; --accent-soft: #1f2a3d;
            --bad: #e08a74; --ok: #7cc28d; --band: #222226; --track: #2c2c31; --hold: #4a4a51; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1, h2, h3, .mark, .amount { font-family: Georgia, "Times New Roman", serif; font-weight: 600; }
  .mark { color: var(--accent); letter-spacing: .05em; font-size: 22px; margin: 0; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button:disabled { opacity: .55; cursor: progress; }
  input, textarea { font: inherit; color: inherit; background: var(--band); border: 0; border-radius: 6px; padding: 7px 9px; }
  input:focus, textarea:focus, button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { display: block; width: 100%; min-height: 76px; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .muted, .note { color: var(--muted); }
  .note { margin: 0 0 10px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Sign-in */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .signin { width: 100%; max-width: 440px; background: var(--panel); border-radius: 12px; padding: 28px; }
  .signin .mark { font-size: 32px; }
  .signin label { display: block; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .signin input { display: block; width: 100%; margin-top: 4px; }
  .signin button[type=submit] { width: 100%; margin-top: 18px; }
  .err { color: var(--bad); min-height: 1.5em; margin: 8px 0 0; }
  .accts h3 { font-size: 15px; margin: 14px 0 2px; }
  .acct { display: grid; grid-template-columns: 1fr auto; width: 100%; text-align: left; background: none; color: var(--ink); padding: 8px 10px; }
  .acct:nth-child(odd) { background: var(--band); }
  .acct:hover { background: var(--accent-soft); }
  .acct small { color: var(--muted); }
  .acct code { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--accent); font: 12px ui-monospace, Menlo, monospace; }

  /* Signed in */
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: var(--panel); }
  header .me { margin-left: auto; text-align: right; line-height: 1.3; min-width: 0; }
  header .me small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  header button { white-space: nowrap; }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px 32px; max-width: 1280px; margin: 0 auto; }
  section { background: var(--panel); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; min-width: 0; }
  h2 { font-size: 17px; margin: 0 0 6px; }
  h2 .n { font: 400 14px system-ui, sans-serif; color: var(--muted); margin-left: 6px; }
  h3 { font-size: 14px; margin: 18px 0 4px; }
  .intro { color: var(--muted); margin: 2px 0 16px; }
  .row { display: grid; grid-template-columns: 1fr 1.25fr .9fr .5fr 1fr; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .row.head { color: var(--muted); font-size: 12px; cursor: default; padding-bottom: 2px; }
  .rows .row:nth-child(even) { background: var(--band); }
  .row:not(.head):hover { background: var(--accent-soft); }
  .row.sel { background: var(--accent-soft) !important; box-shadow: inset 3px 0 var(--accent); }
  .st { font-weight: 600; } .st.bad { color: var(--bad); } .st.ok { color: var(--ok); }
  .empty { color: var(--muted); padding: 6px 10px; margin: 0; }
  aside { position: sticky; top: 16px; align-self: start; }
  .amount { font-size: 30px; margin: 0; }
  .steps { display: flex; flex-wrap: wrap; list-style: none; padding: 0; margin: 14px 0 0; font-size: 13px; color: var(--faint); }
  .steps li + li::before { content: "›"; margin: 0 7px; color: var(--faint); }
  .steps .done { color: var(--ink); } .steps .now { color: var(--accent); font-weight: 600; }
  .off { color: var(--bad); font-weight: 600; margin: 6px 0 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 14px 0 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--track); margin: 6px 0 6px; }
  .bar span { height: 100%; }
  .legend > div { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; padding: 3px 0; }
  .bids > div { display: grid; grid-template-columns: 1fr auto auto 6.5em; gap: 12px; padding: 5px 8px; border-radius: 6px; }
  .bids > div:nth-child(odd) { background: var(--band); }
  .bids .head { color: var(--muted); font-size: 12px; background: none !important; }
  .sw { width: 10px; height: 10px; border-radius: 2px; }
  .small { font-size: 12px; margin: 6px 0 0; }
  .move { margin-top: 18px; padding: 14px; background: var(--band); border-radius: 8px; }
  .move h3 { margin: 0 0 4px; }
  .move p { margin: 0 0 10px; }
  .move .form input { background: var(--panel); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0 0; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .form input { width: 120px; }
  .feed { max-height: 420px; overflow-y: auto; }
  .feed > div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .feed > div:nth-child(odd) { background: var(--band); }
  .feed small { color: var(--muted); }
  #toast { position: fixed; left: 16px; bottom: 16px; max-width: min(560px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 8px;
           background: var(--bad); color: #fff; display: none; z-index: 10; }
  #toast.ok { background: var(--ok); }
  #toast small { display: block; opacity: .85; font: 12px ui-monospace, Menlo, monospace; margin-top: 2px; overflow-wrap: anywhere; }

  /* Network bar, headline numbers, filters, ledger trail */
  .net { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
  .net .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hold); flex: none; }
  .net .dot.live { background: var(--ok); }
  .net .dot.off { background: var(--bad); }
  .net b { color: var(--ink); font-weight: 600; }
  .net .h { font-variant-numeric: tabular-nums; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
  .kpi { background: var(--panel); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .kpi .v { font: 600 20px/1.2 Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .kpi.warn .v { color: var(--bad); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .tools input { flex: 1 1 180px; background: var(--panel); }
  .tools select { font: inherit; color: inherit; background: var(--panel); border: 0; border-radius: 6px; padding: 7px 9px; }
  .demo { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
  .picked { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .trail { list-style: none; padding: 0; margin: 6px 0 0; font-size: 13px; }
  .trail li { display: grid; grid-template-columns: 4.5em 1fr auto; gap: 10px; padding: 4px 8px; border-radius: 6px; }
  .trail li:nth-child(odd) { background: var(--band); }
  .trail time, .trail code { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; }
  button.confirm { background: var(--bad); color: #fff; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; padding: 12px 16px 24px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    header { padding: 12px 16px; }
    aside { position: static; }
  }
  @media (max-width: 640px) {
    header { flex-wrap: wrap; }
    .net { order: 3; width: 100%; }
  }
  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr 1.3fr .9fr 1fr; }
    .row .risk { display: none; }
    .signin { padding: 22px 18px; }
    header { gap: 10px; }
    header .me small { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="login" hidden>
  <form class="signin" id="loginForm">
    <h1 class="mark">RASID</h1>
    <p class="muted">Tokenized MSME invoices on DRUNIX. Sign in to act as one party on the network.</p>
    <label>Username <input id="user" autocomplete="username" autocapitalize="none" required></label>
    <label>Password <input id="pass" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p class="err" id="loginErr"></p>
    <div class="accts" id="accts"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="mark">RASID</div>
    <div class="net" id="net" aria-live="polite"><span class="dot"></span><span>Connecting to the ledger…</span></div>
    <div class="me"><b id="meLabel"></b><small id="meDesc"></small></div>
    <button class="ghost" id="signOut">Sign out</button>
  </header>
  <main>
    <div id="workspace"></div>
    <aside>
      <section id="detail"></section>
      <section>
        <h2>Activity</h2>
        <div class="feed" id="feed"><p class="empty">Ledger events appear here as they happen.</p></div>
      </section>
    </aside>
  </main>
</div>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
